name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==2.3.1

      - name: Install dependencies
        run: poetry install

      - name: Lint with ruff
        run: poetry run ruff check .

      - name: Format check with black
        run: poetry run black --check .

      - name: Sort imports check
        run: poetry run isort --check .

      - name: Type check with mypy
        run: poetry run mypy advance/ --exclude "lab_19|lab_cli"

      - name: Run tests
        run: poetry run pytest intermediate/ advance/ -v --tb=short

      - name: Coverage report
        run: poetry run pytest intermediate/ advance/ --cov=intermediate --cov=advance --cov-report=term-missing --ignore=intermediate/lab_8/alembic

      - name: Audit dependencies
        run: poetry run pip-audit