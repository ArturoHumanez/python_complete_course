[project]
name = "python-complete-course"
version = "0.1.0"
description = ""
authors = [
    {name = "Arturo",email = "arturo.humanez@axity.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)"
]

[tool.poetry]
name = "python-complete-course"
version = "0.1.0"
description = "Laboratorios del curso Python Complete"
readme = "README.md"
package-mode = false


[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "ruff (>=0.15.14,<0.16.0)",
    "pre-commit (>=4.6.0,<5.0.0)"
]
